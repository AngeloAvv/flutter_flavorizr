name: flutterflavorizr_example
description: Demonstrates how to use the flutterflavorizr plugin.
publish_to: 'none'

environment:
  sdk: "3.13.3"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_flavorizr:
    path: ../


flavorizr:
  app:
    android:
      flavorDimensions: "flavor-type" # optional?

  flavors:
    apple:
      app:
        name: "Apple App"

      android:
        applicationId: "com.example.apple"

      ios:
        bundleId: "com.example.apple"

      macos:
        bundleId: "com.example.apple"
        firebase:
          config: "test_resources/macos/targets_firebase_processor_test/GoogleService-Info.plist"

    banana:
      app:
        name: "Banana App"

      android:
        applicationId: "com.example.banana"

      ios:
        bundleId: "com.example.banana"

      macos:
        bundleId: "com.example.banana"


flutter:
  uses-material-design: true
