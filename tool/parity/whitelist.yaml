# Differences from the golden that are intended, one entry per file or glob.
# Every entry needs a reason: say why the new output is allowed to differ.
#
# - path: android/app/src/main/res/**
#   reason: M5 stops generating the dummy launcher assets (#527)
#
# `only-comments: true` makes an entry cover a changed file only if it differs
# from the golden in its `/* ... */` annotations and in nothing else.
#
# `drop-from-golden: <regex>`, `moved: <regex>` (what is in another place in the
# new output, and is the same) and `ignore: <regex>` say what else a pbxproj may
# differ in, on top of `only-comments`: the lines of the golden the new output no
# longer has (the golden is named again without them), and text that the new
# output has more of in the lines it shares with the golden. Both are matched
# against one line, and name the exact thing they vouch for (a generated flavor
# xcconfig, not any xcconfig): what they match is allowed to differ, so a broad
# pattern hides regressions. differ_test.dart runs this file.
#
# `*` matches within a path segment, `**` across segments. Paths are relative
# to the generated project, binaries are listed as `<file>.sha256`.

- path: flavorizr.lock
  reason: >-
    The 3.0 CLI records what a run applied (#501, #506), so that a later run can
    tell its own files from the ones of the user and remove what a dropped flavor
    generated. 2.6.0 has no lock.
- path: android/app/src/main/AndroidManifest.xml
  reason: >-
    android:androidManifest runs on the engine (#509), which changes only the
    label of the application and writes the rest of the file back byte for byte,
    where 2.6.0 serialized the whole document again. The two documents are
    equivalent, which android_differential_test checks.
- path: ios/Runner/Info.plist
  reason: >-
    ios:plist runs on the engine (#520), which replaces only the value of the
    owned keys in the text of the file and keeps the rest byte for byte, where
    2.6.0 serialized the whole document again, reindenting it with two spaces.
    The two documents are equivalent: the same keys, in the same order, with
    the same values.
- path: macos/Runner/Info.plist
  reason: >-
    macos:plist runs on the engine (#520), which replaces only the value of
    `CFBundleName` in the text of the file and keeps the rest byte for byte,
    where 2.6.0 serialized the whole document again, reindenting it with two
    spaces. The two documents are equivalent: the same keys, in the same order,
    with the same values.
- path: linux/CMakeLists.txt
  reason: >-
    linux:cmake runs on the engine (#525), which touches only the marked region:
    2.6.0 also added a blank line on each side of it, outside the markers.
- path: linux/runner/CMakeLists.txt
  reason: >-
    linux:runnerCmake runs on the engine (#525), which touches only the marked
    region: 2.6.0 also added a blank line on each side of it, outside the
    markers.
- path: linux/runner/my_application.cc
  reason: >-
    linux:myApplication runs on the engine (#525), where every edit is inside a
    marked region. The `flutter create` template sets the title with two string
    literals: 2.6.0 rewrote them to use a new `window_title` variable, outside
    of the markers, which cannot be tracked or reverted. 3.0 leaves the two calls
    alone and sets the title again from a region right after each one.
- path: windows/runner/CMakeLists.txt
  reason: >-
    windows:cmake runs on the engine (#526), which touches only the marked
    region, and moves it. The region now sits after `add_executable`, where the
    target exists, and `configure_file` writes `Runner.rc` and `main.cpp` to
    `${CMAKE_CURRENT_BINARY_DIR}` and points the target at them, where 2.6.0
    overwrote the two files of the source tree on every flavored build. The
    rest of the file is the golden one. The templates (`Runner.rc.in`,
    `main.cpp.in`) and every other Windows file are identical to the golden.
- path: lib/flavors.dart
  reason: >-
    flutter:flavors on the engine (#510) makes flavors.dart a scaffold that
    exports flavors.g.dart, where 2.6.0 generated the enum and `F` in it.
- path: lib/flavors.g.dart
  reason: >-
    flutter:flavors on the engine (#510) generates the enum and `F` here, as a
    managed file. `F.appFlavor` reads `appFlavor` of `flutter/services.dart` and
    finds the flavor by the name `flavorizr.yaml` gives it, so it needs no
    initialization and its casing matches.
- path: lib/main.dart
  reason: >-
    flutter:main is a scaffold (#510): it creates lib/main.dart and never
    overwrites it, and the project `flutter create` makes already has one, where
    2.6.0 replaced it. The 2.6.0 file initialized `F.appFlavor`, which is not
    needed anymore.
- path: ios/Runner.xcodeproj/project.pbxproj
  only-comments: true
  drop-from-golden: '^\s*\w{24} /\* Flutter/[^\s";*/\x00-\x1f\x7f-\uffff\\]+(?:Debug|Profile|Release)\.xcconfig in Resources \*/(?: = \{isa = PBXBuildFile; .*\};|,)$'
  moved: '^\s*\w{24} /\* (?:Runner/)?GoogleService-Info\.plist(?: in Resources)? \*/(?: = \{isa = PBX(?:BuildFile|FileReference); .*\};|,)$'
  ignore: '(?<=includeInIndex = 1; )lastKnownFileType = text\.xcconfig; (?=path = "?Flutter/[^\s";*/\x00-\x1f\x7f-\uffff\\]+(?:Debug|Profile|Release)\.xcconfig"?; )|(?<=== \\"Debug-([\w./-]+)\\" \]) \|\| \[ \\"\$CONFIGURATION\\" == \\"Profile-\1\\" \]|ASSETCATALOG_COMPILER_APPICON_NAME = (?:"AppIcon-\$\(ASSET_PREFIX\)"|AppIcon);'
  reason: >-
    dart_xcodeproj 0.4.0 (#513) prints only the annotations of its object model,
    as Ruby's xcodeproj does, where 0.3.0 guessed them from the shape of the
    strings (a file reference is now annotated by its basename, TestTargetID and
    remoteGlobalIDString are not annotated, shell script phases, target
    dependencies, container proxies and Swift packages are). ios:xcconfig on the
    engine (#518) stops adding the flavor xcconfigs to the Resources build phase,
    where 2.6.0 copied them into the app bundle, and gives their file references
    the type Xcode gives them (`lastKnownFileType = text.xcconfig`, which 2.6.0
    lost, as DarwinAddFileProcessor looked the extension up with its dot). Nothing
    else changes: the golden, once those entries are taken out and its UUIDs
    named again, is identical to the new file once the comments are stripped.
    A flavor with no `icon` builds with the `AppIcon` of the project, where
    2.6.0 pointed it at the `AppIcon-<flavor>` set it copied (#529): the value
    of `ASSETCATALOG_COMPILER_APPICON_NAME` is not compared.
    ios:firebase on the engine (#521) adds the reference to
    `Runner/GoogleService-Info.plist` before the legacy `ios:launchScreen` adds
    the storyboards, where 2.6.0 added it after them, so the reference and its
    entry in Resources are in another place of the lists, which names the UUIDs
    of what follows differently: both files are compared without them, once they
    are known to hold the same references (`moved`). The
    script of its `Firebase Setup` phase also copies the configuration for the
    Profile build configurations (see ios/firebaseScript.sh).
- path: macos/Runner.xcodeproj/project.pbxproj
  only-comments: true
  drop-from-golden: '^\s*\w{24} /\* Runner/Configs/[^\s";*/\x00-\x1f\x7f-\uffff\\]+(?:Debug|Profile|Release)\.xcconfig in Resources \*/(?: = \{isa = PBXBuildFile; .*\};|,)$'
  moved: '^\s*\w{24} /\* (?:Runner/)?GoogleService-Info\.plist(?: in Resources)? \*/(?: = \{isa = PBX(?:BuildFile|FileReference); .*\};|,)$'
  ignore: '(?<=includeInIndex = 1; )lastKnownFileType = text\.xcconfig; (?=path = "?Runner/Configs/[^\s";*/\x00-\x1f\x7f-\uffff\\]+(?:Debug|Profile|Release)\.xcconfig"?; )|(?<=== \\"Debug-([\w./-]+)\\" \]) \|\| \[ \\"\$CONFIGURATION\\" == \\"Profile-\1\\" \]|ASSETCATALOG_COMPILER_APPICON_NAME = (?:"AppIcon-\$\(ASSET_PREFIX\)"|AppIcon);'
  reason: >-
    Same as ios/Runner.xcodeproj/project.pbxproj: the comments are the ones
    Ruby's xcodeproj writes (#513), and macos:configs on the engine (#518) does
    not add the flavor xcconfigs of Runner/Configs to the Resources build phase,
    and types their file references. macos:firebase on the engine (#521) adds the
    reference to `Runner/GoogleService-Info.plist` in another place of the
    lists: both files are compared without it, once they are known to hold the
    same reference (`moved`).
- path: ios/Runner.xcodeproj/xcshareddata/xcschemes/*.xcscheme
  ignore: '^ {6}<PreActions>\n {9}<ExecutionAction\n {12}ActionType = "Xcode\.IDEStandardExecutionActionsCore\.ExecutionActionType\.ShellScriptAction">\n {12}<ActionContent\n {15}title = "Run Prepare Flutter Framework Script"\n {15}scriptText = "/bin/sh &quot;\$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend\.sh&quot; prepare&#10;">\n {15}<EnvironmentBuildable>\n {18}<BuildableReference\n {21}BuildableIdentifier = "primary"\n {21}BlueprintIdentifier = "97C146ED1CF9000F007C117D"\n {21}BuildableName = "Runner\.app"\n {21}BlueprintName = "Runner"\n {21}ReferencedContainer = "container:Runner\.xcodeproj">\n {18}</BuildableReference>\n {15}</EnvironmentBuildable>\n {12}</ActionContent>\n {9}</ExecutionAction>\n {6}</PreActions>\n|^ {6}<BuildActionEntries>\n {9}<BuildActionEntry\n(?: {12}buildFor(?:Testing|Running|Profiling|Archiving|Analyzing) = "YES">?\n){5} {12}<BuildableReference\n {15}BuildableIdentifier = "primary"\n {15}BlueprintIdentifier = "97C146ED1CF9000F007C117D"\n {15}BuildableName = "Runner\.app"\n {15}BlueprintName = "Runner"\n {15}ReferencedContainer = "container:Runner\.xcodeproj">\n {12}</BuildableReference>\n {9}</BuildActionEntry>\n {6}</BuildActionEntries>\n'
  reason: >-
    ios:schema on the engine (#517) makes the scheme of a flavor with the
    `Run Prepare Flutter Framework Script` pre-action that Flutter adds when
    Swift Package Manager is enabled, so that a build from Xcode or
    `flutter build` finds it (#286), and with the entry that builds the app,
    which Xcode needs to build anything from the scheme and 2.6.0 left out. The
    two blocks are the only thing not compared, and they are matched whole: the
    action type, the script and the reference to the app target of
    `flutter create` (`Runner`, `Runner.app`, the UUID its template gives it)
    are spelled out, so that a block that points elsewhere is a difference. The
    rest of the scheme, the build configuration of each action included, is the
    golden one.
- path: flavorizr.yaml
  reason: >-
    The configuration is the input of the run, and 3.0 reads `recipes` where
    2.6.0 read `instructions` (#535): `fixtures/flavorizr.3.yaml` lists the same
    processors under the new key.
- path: ios/firebaseScript.sh
  ignore: '(?<=== "Debug-([\w./-]+)" \]) \|\| \[ "\$CONFIGURATION" == "Profile-\1" \]'
  reason: >-
    ios:firebase on the engine (#521) copies the configuration for the Profile
    build configurations too, where 2.6.0 only did for Debug and Release, and
    kept whatever configuration was there in a Profile build. The rest of the
    script is the golden one.
- path: macos/firebaseScript.sh
  ignore: '(?<=== "Debug-([\w./-]+)" \]) \|\| \[ "\$CONFIGURATION" == "Profile-\1" \]'
  reason: >-
    Same as ios/firebaseScript.sh, for macos:firebase.
- path: android/app/flavorizr.gradle.kts
  reason: >-
    The Kotlin DSL file is written against `ApplicationExtension`
    (`com.android.build.api.dsl`), the public DSL, where 2.6.0 used `AppExtension`
    of `com.android.build.gradle`, the legacy one, which resolves only while
    Flutter forces `android.newDsl=false` (#537). `flavorDimensions` is
    appended to with `+=` as the new DSL has it. The flavors are the golden ones.
- path: android/app/src/apple/res/**
  reason: &dummy-android >-
    A flavor with no `icon` has no source set of its own and builds with the
    `res` of `main`, the default icon of the project (#529). 2.6.0 copied dummy
    launcher icons into `src/<flavor>/res`. The golden fixture has no icons.
- path: android/app/src/banana/res/**
  reason: *dummy-android
- path: ios/Runner/Assets.xcassets/AppIcon-apple.appiconset/**
  reason: &dummy-icons >-
    A flavor with no `icon` builds with the `AppIcon` of the project, and
    flavorizr makes no `AppIcon-<flavor>.appiconset` for it (#529), where 2.6.0
    copied dummy ones. `ASSETCATALOG_COMPILER_APPICON_NAME` of the flavor is
    `AppIcon` then (see the `project.pbxproj` entries).
- path: ios/Runner/Assets.xcassets/AppIcon-banana.appiconset/**
  reason: *dummy-icons
- path: macos/Runner/Assets.xcassets/AppIcon-apple.appiconset/**
  reason: *dummy-icons
- path: macos/Runner/Assets.xcassets/AppIcon-banana.appiconset/**
  reason: *dummy-icons
- path: windows/runner/resources/apple.ico.sha256
  reason: &dummy-ico >-
    A flavor with no `icon` builds with the `app_icon.ico` of the project, and
    windows:cmake does not point at an `<flavor>.ico` that does not exist
    (#529), where 2.6.0 built a dummy one.
- path: windows/runner/resources/banana.ico.sha256
  reason: *dummy-ico
- path: ios/Runner/Assets.xcassets/appleLaunchImage.imageset/README.md
  reason: &launch-readme >-
    The launch image set is written in code (#528), with its `Contents.json` and
    its three images. 2.6.0 copied the folder of the downloaded assets, which also
    held a `README.md` about the set.
- path: ios/Runner/Assets.xcassets/bananaLaunchImage.imageset/README.md
  reason: *launch-readme
