# Differences from the golden that are intended, one entry per file or glob.
# Every entry needs a reason: say why the new output is allowed to differ.
#
# - path: android/app/src/main/res/**
#   reason: M5 stops generating the dummy launcher assets (#527)
#
# `only-comments: true` makes an entry cover a changed file only if it differs
# from the golden in its `/* ... */` annotations and in nothing else.
#
# `drop-from-golden: <regex>` and `ignore: <regex>` say what else a pbxproj may
# differ in, on top of `only-comments`: the lines of the golden the new output no
# longer has (the golden is named again without them), and text that the new
# output has more of in the lines it shares with the golden. Both are matched
# against one line, and name the exact thing they vouch for (a generated flavor
# xcconfig, not any xcconfig): what they match is allowed to differ, so a broad
# pattern hides regressions. differ_test.dart runs this file.
#
# `*` matches within a path segment, `**` across segments. Paths are relative
# to the generated project, binaries are listed as `<file>.sha256`.

- path: flavorizr.lock
  reason: >-
    The 3.0 CLI records what a run applied (#501, #506), so that a later run can
    tell its own files from the ones of the user and remove what a dropped flavor
    generated. 2.6.0 has no lock.
- path: android/app/src/main/AndroidManifest.xml
  reason: >-
    android:androidManifest runs on the engine (#509), which changes only the
    label of the application and writes the rest of the file back byte for byte,
    where 2.6.0 serialized the whole document again. The two documents are
    equivalent, which android_differential_test checks.
- path: linux/CMakeLists.txt
  reason: >-
    linux:cmake runs on the engine (#525), which touches only the marked region:
    2.6.0 also added a blank line on each side of it, outside the markers.
- path: linux/runner/CMakeLists.txt
  reason: >-
    linux:runnerCmake runs on the engine (#525), which touches only the marked
    region: 2.6.0 also added a blank line on each side of it, outside the
    markers.
- path: linux/runner/my_application.cc
  reason: >-
    linux:myApplication runs on the engine (#525), where every edit is inside a
    marked region. The `flutter create` template sets the title with two string
    literals: 2.6.0 rewrote them to use a new `window_title` variable, outside
    of the markers, which cannot be tracked or reverted. 3.0 leaves the two calls
    alone and sets the title again from a region right after each one.
- path: lib/flavors.dart
  reason: >-
    flutter:flavors on the engine (#510) makes flavors.dart a scaffold that
    exports flavors.g.dart, where 2.6.0 generated the enum and `F` in it.
- path: lib/flavors.g.dart
  reason: >-
    flutter:flavors on the engine (#510) generates the enum and `F` here, as a
    managed file. `F.appFlavor` reads `appFlavor` of `flutter/services.dart` and
    finds the flavor by the name `flavorizr.yaml` gives it, so it needs no
    initialization and its casing matches.
- path: lib/main.dart
  reason: >-
    flutter:main is a scaffold (#510): it creates lib/main.dart and never
    overwrites it, and the project `flutter create` makes already has one, where
    2.6.0 replaced it. The 2.6.0 file initialized `F.appFlavor`, which is not
    needed anymore.
- path: ios/Runner.xcodeproj/project.pbxproj
  only-comments: true
  drop-from-golden: '^\s*\w{24} /\* Flutter/[^\s";*/\x00-\x1f\x7f-\uffff\\]+(?:Debug|Profile|Release)\.xcconfig in Resources \*/(?: = \{isa = PBXBuildFile; .*\};|,)$'
  ignore: '(?<=includeInIndex = 1; )lastKnownFileType = text\.xcconfig; (?=path = "?Flutter/[^\s";*/\x00-\x1f\x7f-\uffff\\]+(?:Debug|Profile|Release)\.xcconfig"?; )'
  reason: >-
    dart_xcodeproj 0.4.0 (#513) prints only the annotations of its object model,
    as Ruby's xcodeproj does, where 0.3.0 guessed them from the shape of the
    strings (a file reference is now annotated by its basename, TestTargetID and
    remoteGlobalIDString are not annotated, shell script phases, target
    dependencies, container proxies and Swift packages are). ios:xcconfig on the
    engine (#518) stops adding the flavor xcconfigs to the Resources build phase,
    where 2.6.0 copied them into the app bundle, and gives their file references
    the type Xcode gives them (`lastKnownFileType = text.xcconfig`, which 2.6.0
    lost, as DarwinAddFileProcessor looked the extension up with its dot). Nothing
    else changes: the golden, once those entries are taken out and its UUIDs
    named again, is identical to the new file once the comments are stripped.
- path: macos/Runner.xcodeproj/project.pbxproj
  only-comments: true
  drop-from-golden: '^\s*\w{24} /\* Runner/Configs/[^\s";*/\x00-\x1f\x7f-\uffff\\]+(?:Debug|Profile|Release)\.xcconfig in Resources \*/(?: = \{isa = PBXBuildFile; .*\};|,)$'
  ignore: '(?<=includeInIndex = 1; )lastKnownFileType = text\.xcconfig; (?=path = "?Runner/Configs/[^\s";*/\x00-\x1f\x7f-\uffff\\]+(?:Debug|Profile|Release)\.xcconfig"?; )'
  reason: >-
    Same as ios/Runner.xcodeproj/project.pbxproj: the comments are the ones
    Ruby's xcodeproj writes (#513), and macos:configs on the engine (#518) does
    not add the flavor xcconfigs of Runner/Configs to the Resources build phase,
    and types their file references.
