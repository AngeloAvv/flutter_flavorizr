name: Pipeline

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and analyze
    uses: ./.github/workflows/test.yml

  parity:
    name: Golden parity
    needs:
      - test
    uses: ./.github/workflows/parity.yml

  # `example/` is committed flavorized: `flavorizr status` must find nothing.
  drift:
    name: Drift
    needs:
      - test
    uses: ./.github/workflows/drift.yml

  # Flavorizes a project that `flutter create` makes, once for each platform,
  # and checks that a second run has nothing to do, that a flavor that is
  # removed goes away and that the flavor that is left builds.
  e2e:
    name: End to end (${{ matrix.platform }})
    needs:
      - test
    strategy:
      fail-fast: false
      matrix:
        platform: [ android, ios, macos, linux, windows ]
    uses: ./.github/workflows/e2e.yml
    with:
      platform: ${{ matrix.platform }}

  release:
    needs:
      - e2e
    name: Release
    uses: ./.github/workflows/release.yml

  publish:
    needs:
      - release
    name: Publish
    uses: ./.github/workflows/publish.yml

  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [test, parity, drift, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
