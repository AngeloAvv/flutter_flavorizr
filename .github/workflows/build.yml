name: Build Artifacts

on:
  workflow_call:
    inputs:
      flavor:
        required: true
        type: string
      flavorize:
        required: true
        type: boolean
        default: false
      platform:
        required: true
        type: string
      working-directory:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ (inputs.platform == 'android' || inputs.platform == 'linux') && 'ubuntu-latest' || (inputs.platform == 'windows' && 'windows-latest') || 'macos-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: ./.github/actions/setup
        with:
          platform: ${{ inputs.platform }}
      - name: Copy assets
        if: ${{ inputs.flavorize }}
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: cp -r assets "$WORKING_DIRECTORY/.tmp"
      - name: Create project
        if: ${{ inputs.flavorize }}
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: flutter create .
      - name: Run flutter_flavorizr
        if: ${{ inputs.flavorize }}
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: flutter pub run flutter_flavorizr -f
      - name: Set up JDK 17
        if: ${{ inputs.platform == 'android' }}
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        if: ${{ inputs.platform == 'android' }}
        uses: android-actions/setup-android@v4
      - name: Install Linux build dependencies
        if: ${{ inputs.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake
      - name: Build Android AAB
        if: ${{ inputs.platform == 'android' }}
        working-directory: ${{ inputs.working-directory }}/android
        env:
          FLUTTER_FLAVOR: ${{ inputs.flavor }}
        run: |
          flutter build appbundle --release --flavor "$FLUTTER_FLAVOR"
      - name: Build iOS
        if: ${{ inputs.platform == 'ios' }}
        working-directory: ${{ inputs.working-directory }}/ios
        env:
          FLUTTER_FLAVOR: ${{ inputs.flavor }}
        run: |
          flutter build ios --release --no-codesign --flavor "$FLUTTER_FLAVOR"
      - name: Build macOS
        if: ${{ inputs.platform == 'macos' }}
        working-directory: ${{ inputs.working-directory }}/macos
        env:
          FLUTTER_FLAVOR: ${{ inputs.flavor }}
        run: |
          flutter build macos --release --flavor "$FLUTTER_FLAVOR"
      - name: Build Linux
        if: ${{ inputs.platform == 'linux' }}
        working-directory: ${{ inputs.working-directory }}/linux
        env:
          FLUTTER_FLAVOR: ${{ inputs.flavor }}
        run: |
          flutter build linux --release --flavor "$FLUTTER_FLAVOR"
      - name: Build Windows
        if: ${{ inputs.platform == 'windows' }}
        working-directory: ${{ inputs.working-directory }}/windows
        shell: bash
        env:
          FLUTTER_FLAVOR: ${{ inputs.flavor }}
        run: |
          flutter build windows --release --flavor "$FLUTTER_FLAVOR"