name: Golden Parity

on:
  workflow_call:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: ./.github/actions/setup
      - name: Two consecutive 2.6.0 runs are identical
        run: flutter test --run-skipped -t parity
      - name: Current checkout matches the recorded 2.6.0 golden
        run: dart run tool/parity.dart check --flavorizr . --golden tool/parity/golden/2.6.0
